version: "1"
projects:
- name: My project
  environments:
  - name: Production
    services:
    - type: web
      name: crispyuk
      runtime: node
      repo: https://github.com/HusnainMaroof/crispy
      plan: free
      envVars:
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FRANCHISE_BROCHURE_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: NEON_DIRECT_URL
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: RATE_LIMIT_MAX
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false
      - key: JWT_SECRET
        sync: false
      region: oregon
      rootDir: server
      buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm run build
      startCommand: pnpm exec prisma migrate deploy && pnpm start
      autoDeployTrigger: commit
